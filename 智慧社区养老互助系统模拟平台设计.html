<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧社区养老互助系统模拟平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(90deg, #1a73e8, #4285f4);
            color: white;
            padding: 25px 30px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
        }
        
        .header .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }
        
        .card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card h3 i {
            font-size: 1.3rem;
        }
        
        .value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a73e8;
        }
        
        .value.red {
            color: #ea4335;
        }
        
        .value.green {
            color: #34a853;
        }
        
        .value.orange {
            color: #fbbc05;
        }
        
        .label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
        }
        
        .panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }
        
        .panel h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
            font-size: 1.5rem;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1a73e8;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0d62d9;
            box-shadow: 0 5px 15px rgba(26, 115, 232, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-success {
            background: #34a853;
            color: white;
        }
        
        .btn-success:hover {
            background: #2d9449;
        }
        
        .btn-warning {
            background: #fbbc05;
            color: #333;
        }
        
        .btn-warning:hover {
            background: #e6a800;
        }
        
        .data-section {
            margin-top: 25px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th {
            background: #f8f9fa;
            color: #555;
            font-weight: 600;
            padding: 12px 15px;
            text-align: left;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .data-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
        }
        
        .data-table tr:hover {
            background: #f8f9fa;
        }
        
        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        
        .status-normal {
            background: #e6f4ea;
            color: #137333;
        }
        
        .status-warning {
            background: #fef7e0;
            color: #f9ab00;
        }
        
        .status-critical {
            background: #fce8e6;
            color: #c5221f;
        }
        
        .chart-container {
            height: 300px;
            margin: 20px 0;
            position: relative;
        }
        
        .log-container {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
        }
        
        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        
        .log-timestamp {
            color: #666;
            font-size: 0.8rem;
        }
        
        .log-message {
            color: #333;
        }
        
        .log-warning {
            color: #f9ab00;
        }
        
        .log-error {
            color: #ea4335;
        }
        
        .log-success {
            color: #34a853;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .sensor-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #1a73e8;
        }
        
        .sensor-item.warning {
            border-left-color: #fbbc05;
        }
        
        .sensor-item.critical {
            border-left-color: #ea4335;
        }
        
        .sensor-name {
            font-weight: 600;
            color: #333;
        }
        
        .sensor-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a73e8;
            margin-top: 5px;
        }
        
        .simulation-status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #34a853;
        }
        
        .status-indicator.inactive {
            background: #ea4335;
        }
        
        .status-text {
            font-weight: 500;
        }
        
        .elder-list {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }
        
        .elder-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: all 0.3s;
        }
        
        .elder-item:hover {
            background: #e8f0fe;
        }
        
        .elder-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
        }
        
        .elder-info {
            flex: 1;
        }
        
        .elder-name {
            font-weight: 600;
            color: #333;
        }
        
        .elder-age {
            color: #666;
            font-size: 0.9rem;
        }
        
        .health-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: #34a853;
            border-radius: 3px;
        }
        
        .health-fill.warning {
            background: #fbbc05;
        }
        
        .health-fill.critical {
            background: #ea4335;
        }
        
        .footer {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 30px;
            padding: 20px;
        }
        
        @media (max-width: 1200px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fas fa-hands-helping"></i> 智慧社区养老互助系统模拟平台</h1>
                <div class="subtitle">实时监控 · 智能调度 · 应急响应</div>
            </div>
            <div id="currentTime"></div>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3><i class="fas fa-heartbeat"></i> 活跃老人</h3>
                <div class="value" id="activeElders">24</div>
                <div class="label">实时在线监测</div>
            </div>
            <div class="card">
                <h3><i class="fas fa-user-friends"></i> 可用志愿者</h3>
                <div class="value green" id="availableVolunteers">18</div>
                <div class="label">随时待命</div>
            </div>
            <div class="card">
                <h3><i class="fas fa-tasks"></i> 进行中任务</h3>
                <div class="value orange" id="activeTasks">7</div>
                <div class="label">今日处理中</div>
            </div>
            <div class="card">
                <h3><i class="fas fa-exclamation-triangle"></i> 预警事件</h3>
                <div class="value red" id="warningEvents">2</div>
                <div class="label">需关注处理</div>
            </div>
        </div>
        
        <div class="controls">
            <button class="btn btn-primary" onclick="startSimulation()">
                <i class="fas fa-play"></i> 启动模拟
            </button>
            <button class="btn btn-secondary" onclick="pauseSimulation()">
                <i class="fas fa-pause"></i> 暂停模拟
            </button>
            <button class="btn btn-success" onclick="addEmergency()">
                <i class="fas fa-plus-circle"></i> 模拟紧急事件
            </button>
            <button class="btn btn-warning" onclick="resetSystem()">
                <i class="fas fa-redo"></i> 重置系统
            </button>
            <button class="btn btn-secondary" onclick="exportLogs()">
                <i class="fas fa-download"></i> 导出日志
            </button>
        </div>
        
        <div class="main-content">
            <div class="panel">
                <h2><i class="fas fa-chart-line"></i> 系统运行监控</h2>
                
                <div class="sensor-grid" id="sensorGrid">
                    <!-- 传感器数据将通过JS动态生成 -->
                </div>
                
                <div class="simulation-status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <div class="status-text" id="statusText">系统准备就绪</div>
                </div>
                
                <h3 style="margin-top: 30px;"><i class="fas fa-history"></i> 实时数据流</h3>
                <div class="log-container" id="logContainer">
                    <!-- 日志将通过JS动态生成 -->
                </div>
            </div>
            
            <div class="panel">
                <h2><i class="fas fa-users"></i> 老人状态监控</h2>
                <div class="elder-list" id="elderList">
                    <!-- 老人列表将通过JS动态生成 -->
                </div>
                
                <h3 style="margin-top: 30px;"><i class="fas fa-tasks"></i> 任务队列</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>任务ID</th>
                            <th>类型</th>
                            <th>优先级</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="taskTable">
                        <!-- 任务数据将通过JS动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="footer">
            <p>智慧社区养老互助系统模拟平台 v2.0 | 数据模拟更新间隔: <span id="updateInterval">1000</span>ms</p>
            <p>总运行时间: <span id="uptime">00:00:00</span> | 处理事件: <span id="processedEvents">0</span></p>
        </div>
    </div>

    <script>
        // 系统核心数据
        class SmartCommunitySystem {
            constructor() {
                this.elders = [];
                this.volunteers = [];
                this.tasks = [];
                this.sensors = [];
                this.events = [];
                this.isRunning = false;
                this.simulationInterval = null;
                this.startTime = Date.now();
                this.processedEvents = 0;
                this.updateInterval = 1000; // 1秒更新一次
                
                this.initData();
            }
            
            initData() {
                // 初始化老人数据
                this.elders = [
                    { id: 1, name: "王建国", age: 78, health: 85, status: "normal", lastCheck: Date.now() },
                    { id: 2, name: "李秀英", age: 82, health: 72, status: "normal", lastCheck: Date.now() },
                    { id: 3, name: "张卫国", age: 75, health: 45, status: "warning", lastCheck: Date.now() },
                    { id: 4, name: "刘桂芳", age: 85, health: 90, status: "normal", lastCheck: Date.now() },
                    { id: 5, name: "陈志强", age: 79, health: 30, status: "critical", lastCheck: Date.now() },
                    { id: 6, name: "赵玉兰", age: 81, health: 65, status: "normal", lastCheck: Date.now() }
                ];
                
                // 初始化志愿者数据
                this.volunteers = [
                    { id: 1, name: "志愿者A", skills: ["first_aid", "companion"], available: true, location: "A区" },
                    { id: 2, name: "志愿者B", skills: ["companion", "shopping"], available: true, location: "B区" },
                    { id: 3, name: "志愿者C", skills: ["first_aid", "medical"], available: false, location: "C区" },
                    { id: 4, name: "志愿者D", skills: ["shopping", "cleaning"], available: true, location: "D区" },
                    { id: 5, name: "志愿者E", skills: ["medical", "first_aid"], available: true, location: "A区" }
                ];
                
                // 初始化传感器数据
                this.sensors = [
                    { id: 1, name: "心率监测", value: 72, unit: "bpm", threshold: { min: 50, max: 120 } },
                    { id: 2, name: "血氧饱和度", value: 97, unit: "%", threshold: { min: 92, max: 100 } },
                    { id: 3, name: "活动检测", value: 85, unit: "活跃度", threshold: { min: 20, max: 100 } },
                    { id: 4, name: "环境温度", value: 24, unit: "°C", threshold: { min: 18, max: 28 } },
                    { id: 5, name: "摔倒检测", value: 0, unit: "次数", threshold: { max: 0 } },
                    { id: 6, name: "呼叫响应", value: 98, unit: "%", threshold: { min: 90, max: 100 } }
                ];
                
                // 初始化任务
                this.tasks = [
                    { id: 1, type: "日常关怀", priority: 2, status: "进行中", elder: "王建国", volunteer: "志愿者A" },
                    { id: 2, type: "药品配送", priority: 1, status: "等待中", elder: "张卫国", volunteer: "" },
                    { id: 3, type: "医疗检查", priority: 1, status: "已完成", elder: "李秀英", volunteer: "志愿者E" }
                ];
            }
            
            updateSensorData() {
                // 模拟传感器数据更新
                this.sensors.forEach(sensor => {
                    let change = 0;
                    switch(sensor.name) {
                        case "心率监测":
                            change = Math.random() * 10 - 5; // -5到+5的变化
                            break;
                        case "血氧饱和度":
                            change = Math.random() * 4 - 2; // -2到+2的变化
                            break;
                        case "活动检测":
                            change = Math.random() * 20 - 10; // -10到+10的变化
                            break;
                        case "环境温度":
                            change = Math.random() * 2 - 1; // -1到+1的变化
                            break;
                        case "摔倒检测":
                            // 5%的概率检测到摔倒
                            if (Math.random() < 0.05) {
                                change = 1;
                                this.addEvent("warning", `检测到老人摔倒事件`);
                            }
                            break;
                        case "呼叫响应":
                            change = Math.random() * 5 - 2.5; // -2.5到+2.5的变化
                            break;
                    }
                    
                    // 更新传感器值，确保在合理范围内
                    sensor.value = Math.max(0, Math.min(100, sensor.value + change));
                    sensor.value = Math.round(sensor.value * 10) / 10;
                });
            }
            
            updateElderHealth() {
                // 更新老人健康状况
                this.elders.forEach(elder => {
                    // 模拟健康状况的微小变化
                    let healthChange = Math.random() * 4 - 2; // -2到+2的变化
                    elder.health = Math.max(0, Math.min(100, elder.health + healthChange));
                    elder.health = Math.round(elder.health);
                    
                    // 根据健康状况更新状态
                    if (elder.health < 30) {
                        elder.status = "critical";
                    } else if (elder.health < 50) {
                        elder.status = "warning";
                        if (Math.random() < 0.1) {
                            this.addEvent("warning", `${elder.name}健康状况需要关注`);
                        }
                    } else {
                        elder.status = "normal";
                    }
                    
                    elder.lastCheck = Date.now();
                });
            }
            
            updateVolunteerStatus() {
                // 模拟志愿者状态变化
                this.volunteers.forEach(volunteer => {
                    if (Math.random() < 0.1) { // 10%的概率状态变化
                        volunteer.available = !volunteer.available;
                        this.addEvent("info", `志愿者${volunteer.name}${volunteer.available ? '恢复可用' : '暂时忙碌'}`);
                    }
                });
            }
            
            processTasks() {
                // 处理任务状态更新
                this.tasks.forEach(task => {
                    if (task.status === "进行中" && Math.random() < 0.3) {
                        task.status = "已完成";
                        this.addEvent("success", `任务#${task.id} ${task.type} 已完成`);
                    } else if (task.status === "等待中" && Math.random() < 0.2) {
                        // 尝试分配志愿者
                        const availableVolunteers = this.volunteers.filter(v => v.available);
                        if (availableVolunteers.length > 0) {
                            const volunteer = availableVolunteers[Math.floor(Math.random() * availableVolunteers.length)];
                            task.volunteer = volunteer.name;
                            task.status = "进行中";
                            this.addEvent("success", `任务#${task.id} 已分配给${volunteer.name}`);
                        }
                    }
                });
                
                // 偶尔生成新任务
                if (Math.random() < 0.15 && this.elders.length > 0) {
                    const elder = this.elders[Math.floor(Math.random() * this.elders.length)];
                    const taskTypes = ["日常关怀", "药品配送", "医疗协助", "生活用品采购", "陪伴聊天"];
                    const newTask = {
                        id: this.tasks.length + 1,
                        type: taskTypes[Math.floor(Math.random() * taskTypes.length)],
                        priority: Math.floor(Math.random() * 3) + 1,
                        status: "等待中",
                        elder: elder.name,
                        volunteer: ""
                    };
                    this.tasks.push(newTask);
                    this.addEvent("info", `生成新任务: ${newTask.type} 为 ${elder.name}`);
                }
            }
            
            addEvent(type, message) {
                const event = {
                    timestamp: new Date().toLocaleTimeString(),
                    type: type,
                    message: message
                };
                this.events.unshift(event); // 添加到开头
                this.processedEvents++;
                
                // 限制事件数量
                if (this.events.length > 50) {
                    this.events.pop();
                }
                
                return event;
            }
            
            getAvailableVolunteers() {
                return this.volunteers.filter(v => v.available).length;
            }
            
            getWarningEvents() {
                return this.events.filter(e => e.type === "warning" || e.type === "critical").length;
            }
            
            getActiveTasks() {
                return this.tasks.filter(t => t.status === "进行中" || t.status === "等待中").length;
            }
            
            getUptime() {
                const seconds = Math.floor((Date.now() - this.startTime) / 1000);
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            start() {
                if (!this.isRunning) {
                    this.isRunning = true;
                    this.simulationInterval = setInterval(() => {
                        this.updateSensorData();
                        this.updateElderHealth();
                        this.updateVolunteerStatus();
                        this.processTasks();
                        this.updateUI();
                    }, this.updateInterval);
                    this.addEvent("success", "模拟系统已启动");
                }
            }
            
            stop() {
                if (this.isRunning) {
                    clearInterval(this.simulationInterval);
                    this.isRunning = false;
                    this.addEvent("info", "模拟系统已暂停");
                }
            }
            
            addEmergency() {
                const emergencies = [
                    "老人突发不适，需要紧急医疗援助",
                    "检测到老人长时间无活动，请检查",
                    "环境传感器报警，温度异常",
                    "紧急呼叫按钮被触发",
                    "老人外出未归，位置异常"
                ];
                
                const emergency = emergencies[Math.floor(Math.random() * emergencies.length)];
                const elder = this.elders[Math.floor(Math.random() * this.elders.length)];
                
                // 创建紧急任务
                const emergencyTask = {
                    id: this.tasks.length + 1,
                    type: "紧急响应",
                    priority: 0, // 最高优先级
                    status: "等待中",
                    elder: elder.name,
                    volunteer: ""
                };
                this.tasks.unshift(emergencyTask);
                
                this.addEvent("error", `⚠️ 紧急事件: ${emergency} (${elder.name})`);
            }
            
            reset() {
                this.stop();
                this.initData();
                this.events = [];
                this.startTime = Date.now();
                this.processedEvents = 0;
                this.addEvent("info", "系统已重置");
                this.updateUI();
            }
            
            updateUI() {
                // 更新时间显示
                document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
                
                // 更新统计数据
                document.getElementById('activeElders').textContent = this.elders.length;
                document.getElementById('availableVolunteers').textContent = this.getAvailableVolunteers();
                document.getElementById('activeTasks').textContent = this.getActiveTasks();
                document.getElementById('warningEvents').textContent = this.getWarningEvents();
                document.getElementById('uptime').textContent = this.getUptime();
                document.getElementById('processedEvents').textContent = this.processedEvents;
                document.getElementById('updateInterval').textContent = this.updateInterval;
                
                // 更新状态指示器
                const indicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');
                if (this.isRunning) {
                    indicator.classList.remove('inactive');
                    statusText.textContent = `模拟运行中 (${this.getUptime()})`;
                } else {
                    indicator.classList.add('inactive');
                    statusText.textContent = '模拟已暂停';
                }
                
                // 更新传感器网格
                this.updateSensorGrid();
                
                // 更新老人列表
                this.updateElderList();
                
                // 更新任务表格
                this.updateTaskTable();
                
                // 更新日志
                this.updateLogs();
            }
            
            updateSensorGrid() {
                const grid = document.getElementById('sensorGrid');
                grid.innerHTML = '';
                
                this.sensors.forEach(sensor => {
                    const sensorDiv = document.createElement('div');
                    sensorDiv.className = 'sensor-item';
                    
                    // 检查阈值
                    let statusClass = '';
                    if (sensor.threshold.min !== undefined && sensor.value < sensor.threshold.min) {
                        statusClass = 'warning';
                    } else if (sensor.threshold.max !== undefined && sensor.value > sensor.threshold.max) {
                        statusClass = 'critical';
                    } else if (sensor.threshold.max === 0 && sensor.value > 0) {
                        statusClass = 'critical';
                    }
                    
                    if (statusClass) {
                        sensorDiv.classList.add(statusClass);
                    }
                    
                    sensorDiv.innerHTML = `
                        <div class="sensor-name">${sensor.name}</div>
                        <div class="sensor-value">${sensor.value} ${sensor.unit}</div>
                        <div class="label">阈值: ${sensor.threshold.min || 'N/A'} ~ ${sensor.threshold.max || 'N/A'}</div>
                    `;
                    
                    grid.appendChild(sensorDiv);
                });
            }
            
            updateElderList() {
                const list = document.getElementById('elderList');
                list.innerHTML = '';
                
                this.elders.forEach(elder => {
                    const elderDiv = document.createElement('div');
                    elderDiv.className = 'elder-item';
                    
                    const healthPercent = elder.health;
                    let healthClass = '';
                    if (elder.health < 30) {
                        healthClass = 'critical';
                    } else if (elder.health < 50) {
                        healthClass = 'warning';
                    }
                    
                    const initials = elder.name.split('').filter(c => c.match(/[\u4e00-\u9fff]/)).slice(0, 2).join('');
                    
                    elderDiv.innerHTML = `
                        <div class="elder-avatar">${initials}</div>
                        <div class="elder-info">
                            <div class="elder-name">${elder.name} <span style="font-size: 0.9em; color: #666;">${elder.age}岁</span></div>
                            <div class="health-bar">
                                <div class="health-fill ${healthClass}" style="width: ${healthPercent}%"></div>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                                <span class="elder-age">健康指数: ${elder.health}%</span>
                                <span class="status ${elder.status === 'critical' ? 'status-critical' : elder.status === 'warning' ? 'status-warning' : 'status-normal'}">${elder.status === 'critical' ? '危险' : elder.status === 'warning' ? '预警' : '正常'}</span>
                            </div>
                        </div>
                    `;
                    
                    list.appendChild(elderDiv);
                });
            }
            
            updateTaskTable() {
                const table = document.getElementById('taskTable');
                table.innerHTML = '';
                
                // 只显示前5个任务
                const displayTasks = this.tasks.slice(0, 5);
                
                displayTasks.forEach(task => {
                    const row = document.createElement('tr');
                    
                    let priorityText = '';
                    let priorityClass = '';
                    switch(task.priority) {
                        case 0:
                            priorityText = '紧急';
                            priorityClass = 'status-critical';
                            break;
                        case 1:
                            priorityText = '高';
                            priorityClass = 'status-warning';
                            break;
                        case 2:
                            priorityText = '中';
                            priorityClass = '';
                            break;
                        case 3:
                            priorityText = '低';
                            priorityClass = 'status-normal';
                            break;
                    }
                    
                    let statusClass = '';
                    switch(task.status) {
                        case '进行中':
                            statusClass = 'status-warning';
                            break;
                        case '已完成':
                            statusClass = 'status-normal';
                            break;
                        case '等待中':
                            statusClass = '';
                            break;
                    }
                    
                    row.innerHTML = `
                        <td>#${task.id}</td>
                        <td>${task.type}</td>
                        <td><span class="${priorityClass}">${priorityText}</span></td>
                        <td><span class="status ${statusClass}">${task.status}</span></td>
                    `;
                    
                    table.appendChild(row);
                });
            }
            
            updateLogs() {
                const container = document.getElementById('logContainer');
                container.innerHTML = '';
                
                // 显示最近10个事件
                const recentEvents = this.events.slice(0, 10);
                
                recentEvents.forEach(event => {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'log-entry';
                    
                    let typeClass = '';
                    switch(event.type) {
                        case 'error':
                        case 'critical':
                            typeClass = 'log-error';
                            break;
                        case 'warning':
                            typeClass = 'log-warning';
                            break;
                        case 'success':
                            typeClass = 'log-success';
                            break;
                        default:
                            typeClass = '';
                    }
                    
                    logEntry.innerHTML = `
                        <span class="log-timestamp">[${event.timestamp}]</span>
                        <span class="log-message ${typeClass}">${event.message}</span>
                    `;
                    
                    container.appendChild(logEntry);
                });
                
                // 如果没有任何事件，显示提示
                if (this.events.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'log-entry';
                    emptyMsg.innerHTML = '<span class="log-message">暂无系统事件记录</span>';
                    container.appendChild(emptyMsg);
                }
            }
            
            exportLogs() {
                const logText = this.events.map(e => `[${e.timestamp}] ${e.message}`).join('\n');
                const blob = new Blob([logText], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `community_care_log_${new Date().toISOString().slice(0, 10)}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                this.addEvent("success", "系统日志已导出");
            }
        }
        
        // 初始化系统
        let communitySystem = new SmartCommunitySystem();
        
        // 页面加载完成后初始化UI
        document.addEventListener('DOMContentLoaded', function() {
            communitySystem.updateUI();
            
            // 初始添加一些事件
            communitySystem.addEvent("info", "智慧社区养老互助系统初始化完成");
            communitySystem.addEvent("success", "系统准备就绪，等待启动指令");
            communitySystem.addEvent("info", "当前监测老人: " + communitySystem.elders.length + "人");
            communitySystem.addEvent("info", "可用志愿者: " + communitySystem.getAvailableVolunteers() + "人");
        });
        
        // 全局控制函数
        function startSimulation() {
            communitySystem.start();
        }
        
        function pauseSimulation() {
            communitySystem.stop();
        }
        
        function addEmergency() {
            communitySystem.addEmergency();
        }
        
        function resetSystem() {
            if (confirm("确定要重置系统吗？所有数据将被清除。")) {
                communitySystem.reset();
            }
        }
        
        function exportLogs() {
            communitySystem.exportLogs();
        }
        
        // 添加键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (communitySystem.isRunning) {
                    pauseSimulation();
                } else {
                    startSimulation();
                }
            } else if (e.key === 'e' || e.key === 'E') {
                e.preventDefault();
                addEmergency();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                resetSystem();
            }
        });
        
        // 添加系统信息提示
        console.log("智慧社区养老互助系统模拟平台已加载");
        console.log("快捷键:");
        console.log("  空格键 - 启动/暂停模拟");
        console.log("  E键 - 模拟紧急事件");
        console.log("  R键 - 重置系统");
    </script>
</body>
</html>
